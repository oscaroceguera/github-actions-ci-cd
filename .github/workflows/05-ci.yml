name: 05 - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Lint
        run: pnpm lint:frontend

  frontend-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Lint
        run: pnpm test:frontend

  backend-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Lint
        run: pnpm lint:backend

  backend-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Test
        run: pnpm test:backend
