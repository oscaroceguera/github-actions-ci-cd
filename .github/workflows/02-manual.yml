name: 02 - MANUAL

on:
  workflow_dispatch:
    inputs:
      loggin_level:
        description: Nivel de logging
        required: true
      environment:
        description: Entorno de despliegue
        required: true
      dry_run:
        description: Ejecutar en modo simulacro
        required: true
      reason:
        description: Motivo de la ejecución
        required: true

jobs:
  manual:
    runs-on: ubuntu-22.04
    steps:
      - name: Mostrar todos los inputs
        env:
          LOG_LEVEL: ${{ inputs.loggin_level }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          REASON: ${{ inputs.dry_run }}
        run: |
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "DRY_RUN: $DRY_RUN"
          echo "REASON: $REASON"

      - name: Deploy (solo si no es dry-run)
        if: ${{ !inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Deploying to $ENVIRONMENT"

      - name: Solo log si es dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: no changes applied"
